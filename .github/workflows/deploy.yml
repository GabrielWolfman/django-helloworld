name: Deploy to Amazon

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pull code from github
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: sa-east-1
        
      - name: Configure to push a Docker image to an Amazon ECR repository
        run: aws ecr get-login-password --region sa-east-1 | docker login --username AWS --password-stdin 427780306479.dkr.ecr.sa-east-1.amazonaws.com

      - name: Build image
        run: docker build -t django-app:latest .

      - name: Tag image
        run: docker tag django-app:latest 427780306479.dkr.ecr.sa-east-1.amazonaws.com/devops-projects:latest

      - name: Push image to ECR
        run: docker push 427780306479.dkr.ecr.sa-east-1.amazonaws.com/devops-projects:latest